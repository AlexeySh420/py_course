<!DOCTYPE html>

<html lang="en">

    <head>
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <title>Grocery list🍌</title>

        <style>
            body {
                font-family: "Arial", sans-serif;
            }

            h1 {
                text-align: center;
            }

            input {
                display: block;
                margin: 0 auto;
                margin-bottom: 10px;
            }

            button,
            a {
                display: inline-block;
                padding: 10px 20px;
                background-color: #4CAF50;
                color: white;
                text-align: center;
                text-decoration: none;
                border-radius: 5px;
                border: none
            }

            .button-container {
                text-align: center;
            }


            table {
                margin-left: auto;
                margin-right: auto;
                border-collapse: collapse;
                border: 2px solid black;
            }

            th,
            td,
            tr {
                text-align: center;
                border: 1.5px solid black;
            }
        </style>
        <h1>Grocery list🍎🍰🍕</h1>
    </head>

    {% block body %}{% endblock %}

</html>
